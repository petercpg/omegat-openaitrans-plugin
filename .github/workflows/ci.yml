name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main, release ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            11
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run code formatting and tests
        run: ./gradlew check

      - name: Build plugin JAR
        run: ./gradlew jar

      - name: Generate SBOM (SPDX format)
        uses: anchore/sbom-action@v0
        with:
          path: ./build/libs
          format: spdx-json
          output-file: build/libs/sbom.spdx.json

      - name: Upload Artifacts (JAR and SBOM)
        uses: actions/upload-artifact@v7
        with:
          name: omegat-openaitrans-plugin
          path: |
            build/libs/*.jar
            build/libs/sbom.spdx.json
